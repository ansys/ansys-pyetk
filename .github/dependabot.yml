version: 2
updates:
  - package-ecosystem: "uv" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 7
      include:
        - "*"  # Include all dependencies in cooldown
      exclude:
        - "ansys-aedt-toolkits-common"
        - "pyaedt"
        - "ansys-sphinx-theme"
    # Group python dependencies but exclude key Ansys packages
    groups:
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "ansys-aedt-toolkits-common"
          - "pyaedt"
          - "ansys-sphinx-theme"
    assignees:
      - "DaveTwyman"
      - "jvela018"
      - "nunesanderson"
    labels:
      - "maintenance"
      - "dependencies"
    commit-message:
      prefix: "BUILD(uv)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 7
      include:
        - "*"
      exclude:
        - "ansys/actions"
    # Group GitHub Actions dependency updates into a single PR
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - "DaveTwyman"
      - "jvela018"
      - "nunesanderson"
    labels:
      - "maintenance"
      - "dependencies"
    commit-message:
      prefix: "BUILD(actions)"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 7
      include:
        - "*"  # Include all dependencies in cooldown
      exclude:
        - "ansys/pre-commit-hooks"
    # Group pre-commit dependency updates into a single PR
    groups:
      pre-commit:
        patterns:
          - "*"
    assignees:
      - "DaveTwyman"
      - "jvela018"
      - "nunesanderson"
    labels:
      - "maintenance"
      - "dependencies"
    commit-message:
      prefix: "BUILD(pre-commit)"